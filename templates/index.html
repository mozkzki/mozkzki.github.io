<!doctype html>
<!-- scripts/build.py が生成する。直すのは templates/index.html と data/catalog.json -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mozksoft</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<main>
  <h1>mozksoft</h1>
  <nav>
$filters
  </nav>
$featured
  <ul>
$items
  </ul>
  <footer>
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSfV_eOPGrD3dArMnnE3P2faVMuXxs2x-8xZtliHJrInnO8jHA/viewform">お問い合わせ</a>
    <a href="tokushoho/">特定商取引法に基づく表記</a>
    <small>© mozksoft</small>
  </footer>
</main>
<script>
  // 押したボタンの分類だけ残す。もう一度押すと全部に戻る
  const buttons = document.querySelectorAll("nav button");
  const cards = document.querySelectorAll("[data-category]");
  buttons.forEach(b => b.addEventListener("click", () => {
    const on = b.getAttribute("aria-pressed") !== "true";
    buttons.forEach(x => x.setAttribute("aria-pressed", String(x === b && on)));
    cards.forEach(c => { c.hidden = on && c.dataset.category !== b.dataset.filter; });
  }));
</script>
</body>
</html>
